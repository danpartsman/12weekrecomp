  <text x="124" y="160" font-family="Arial, sans-serif" font-size="11" fill="#475569">Fat</text>
  <text x="196" y="160" text-anchor="end" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">62 g</text>
