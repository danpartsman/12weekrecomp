<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="title desc">
  <title id="title">Food tracking app</title>
  <desc id="desc">A smartphone showing calories, protein, carbohydrate and fat entries.</desc>
  <rect width="320" height="220" rx="24" fill="#f8fafc"/>
  <rect x="98" y="20" width="124" height="180" rx="22" fill="#111827"/>
  <rect x="108" y="34" width="104" height="148" rx="12" fill="#ffffff"/>
  <rect x="142" y="25" width="36" height="5" rx="3" fill="#64748b"/>
  <text x="160" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">TODAY</text>
  <rect x="120" y="70" width="80" height="26" rx="8" fill="#eff6ff"/>
  <text x="160" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">1,940 kcal</text>
  <text x="124" y="116" font-family="Arial, sans-serif" font-size="11" fill="#475569">Protein</text>
