name: Diagnose TEST ledger access
on:
  push:
    branches: [test]
    paths: [.github/workflows/ledger-diagnostic.yml]
jobs:
  diagnose:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3FC67E9AC30B4A5FB2C1C107B84D8B80 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_91AF6C5B8085425781068E9B0080051C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_28C36820998A4A0AB8C5EBB50A54AE0E }}
      - name: Read route and access diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $group = az webapp list --query "[?name=='recomp-test'].resourceGroup | [0]" -o tsv
          $pub = az webapp deployment list-publishing-credentials --resource-group $group --name recomp-test | ConvertFrom-Json
          $auth = az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv
          Write-Output "::add-mask::$auth"
          $scm = "https://$(([Uri]$pub.scmUri).Host)"
          $script = @'
          $ErrorActionPreference='Stop'
          if($env:WEBSITE_SITE_NAME -ne 'recomp-test'){throw 'TEST only'}
          $route='https://test.12weekrecomp.com/clients/6f156c0a-feed-47a4-b832-e9581aa81ad4/coach-ledger'
          try { $r=Invoke-WebRequest $route -UseBasicParsing -MaximumRedirection 0 -ErrorAction SilentlyContinue; Write-Output "Route status: $($r.StatusCode) location: $($r.Headers.Location)" } catch { Write-Output "Route status: $([int]$_.Exception.Response.StatusCode)" }
          $connection=$env:SQLAZURECONNSTR_RecompDatabase
          if(!$connection){$connection=$env:SQLCONNSTR_RecompDatabase}
          if(!$connection){$connection=$env:CUSTOMCONNSTR_RecompDatabase}
          if(!$connection){$connection=$env:ConnectionStrings__RecompDatabase}
          $builder=New-Object System.Data.Common.DbConnectionStringBuilder
          $builder.ConnectionString=$connection
          $builder.Remove('Authentication') | Out-Null
          $builder.Remove('User Id') | Out-Null
          $builder.Remove('Password') | Out-Null
          $identity=Invoke-RestMethod -Uri ($env:IDENTITY_ENDPOINT+'?resource=https%3A%2F%2Fdatabase.windows.net%2F&api-version=2019-08-01') -Headers @{'X-IDENTITY-HEADER'=$env:IDENTITY_HEADER}
          $db=New-Object System.Data.SqlClient.SqlConnection($builder.ConnectionString)
          $db.AccessToken=$identity.access_token
          $db.Open()
          $cmd=$db.CreateCommand()
          $cmd.CommandText="SELECT 'agreement' AS kind, CONVERT(varchar(36),CoachUserId) AS actor FROM app.CoachAccountabilityAgreements WHERE ClientId='6f156c0a-feed-47a4-b832-e9581aa81ad4' UNION ALL SELECT 'active-coach',CONVERT(varchar(36),CoachUserId) FROM app.CoachClientRelationships WHERE ClientId='6f156c0a-feed-47a4-b832-e9581aa81ad4' AND StatusCode='ACTIVE' AND RevokedAtUtc IS NULL UNION ALL SELECT 'active-owner',CONVERT(varchar(36),UserId) FROM app.UserClientAccess WHERE ClientId='6f156c0a-feed-47a4-b832-e9581aa81ad4' AND AccessRoleCode='OWNER' AND RevokedAtUtc IS NULL"
          $r=$cmd.ExecuteReader()
          while($r.Read()){Write-Output "$($r.GetString(0)): $($r.GetString(1))"}
          $r.Close();$db.Close()
          '@
          $encoded=[Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($script))
          $body=@{command="powershell.exe -NoProfile -EncodedCommand $encoded";dir='D:\home'} | ConvertTo-Json
          $result=Invoke-RestMethod "$scm/api/command" -Method Post -Headers @{Authorization="Bearer $auth"} -ContentType application/json -Body $body
          Write-Output $result.Output
          if($result.ExitCode -ne 0){Write-Output $result.Error;throw 'Diagnostic failed'}
