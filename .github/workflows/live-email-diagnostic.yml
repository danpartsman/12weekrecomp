name: Diagnose LIVE password reset email
on:
  push:
    branches: [main]
    paths: ['.github/workflows/live-email-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - uses: azure/login@v2
        with:
          client-id: a81057ec-568b-4cec-9a95-1d4d3ff549a0
          tenant-id: e5e2dff4-ed49-4038-95d0-63d75304d52e
          subscription-id: 14564a14-42f9-4d2e-8a0b-a7c844dfb5c0
      - name: Build account and authorized reset-email verification
        shell: pwsh
        run: |
          New-Item -ItemType Directory ./email-diagnostic -Force | Out-Null
          Copy-Item tools/WebRecomp.DatabaseMigrator/WebRecomp.DatabaseMigrator.csproj ./email-diagnostic/EmailDiagnostic.csproj
          @'
          using Microsoft.Data.SqlClient;
          using System.Net;
          using System.Text.RegularExpressions;
          using System.Buffers.Binary;
          var connection = Environment.GetEnvironmentVariable("SQLAZURECONNSTR_RecompDatabase")
              ?? Environment.GetEnvironmentVariable("SQLCONNSTR_RecompDatabase")
              ?? Environment.GetEnvironmentVariable("CUSTOMCONNSTR_RecompDatabase")
              ?? Environment.GetEnvironmentVariable("ConnectionStrings__RecompDatabase");
          if (string.IsNullOrWhiteSpace(connection)) return 2;
          var builder = new SqlConnectionStringBuilder(connection);
          if (Environment.GetEnvironmentVariable("WEBSITE_SITE_NAME") != "recomp-live" || builder.InitialCatalog != "sqldb-recomp-live") return 3;
          await using var sql = new SqlConnection(connection);
          await sql.OpenAsync();
          await using var cmd = sql.CreateCommand();
          cmd.Parameters.AddWithValue("@digest", "BEAB1518902FC97A1E9D875DD9C3FAF5EECB0E42ECE32E06416C00303DCF9381");
          cmd.CommandText = """
          SELECT u.email_normalized,u.contact_email,u.account_status_code,c.PasswordHash,c.GlobalRoleCode,c.FailedSignInCount,c.LockoutEndUtc,c.LastSignInAtUtc,c.CreatedAtUtc,c.UpdatedAtUtc
          FROM app.UserAccounts u LEFT JOIN app.LocalAuthCredentials c ON c.UserId=u.user_id
          WHERE CONVERT(varchar(64),HASHBYTES('SHA2_256',LOWER(CONVERT(varchar(320),u.email_normalized))),2)=@digest;
          """;
          string email;
          await using (var reader = await cmd.ExecuteReaderAsync()) {
              if (!await reader.ReadAsync()) { Console.WriteLine("AccountMatches=0"); return 4; }
              email=reader.GetString(0);
              Console.WriteLine("AccountActive=" + (reader.GetString(2)=="ACTIVE"));
              Console.WriteLine("CredentialPresent=" + !reader.IsDBNull(3));
              Console.WriteLine("Role=" + (reader.IsDBNull(4)?"NONE":reader.GetString(4)));
              Console.WriteLine("FailedSignInCount=" + (reader.IsDBNull(5)?0:reader.GetInt32(5)));
              Console.WriteLine("CurrentlyLockedOut=" + (!reader.IsDBNull(6) && reader.GetDateTime(6)>DateTime.UtcNow));
              foreach (var i in new[]{6,7,8,9}) Console.WriteLine(reader.GetName(i)+"="+(reader.IsDBNull(i)?"None":reader.GetDateTime(i).ToString("O")));
              bool wellFormed=false;
              if (!reader.IsDBNull(3)) {
                  try {
                      var hash=Convert.FromBase64String(reader.GetString(3));
                      wellFormed=hash.Length>=49 && hash[0]==1 && BinaryPrimitives.ReadUInt32BigEndian(hash.AsSpan(1,4))<=2 && BinaryPrimitives.ReadUInt32BigEndian(hash.AsSpan(5,4))>0 && BinaryPrimitives.ReadUInt32BigEndian(hash.AsSpan(9,4))>=16 && hash.Length>=13+BinaryPrimitives.ReadUInt32BigEndian(hash.AsSpan(9,4))+16;
                  } catch {}
              }
              Console.WriteLine("CredentialHashWellFormed="+wellFormed);
              if (await reader.ReadAsync()) { Console.WriteLine("AccountMatches=Multiple"); return 5; }
          }
          cmd.CommandText = """
          SELECT account_status_code,COUNT(*) AS MatchingAccounts
          FROM app.UserAccounts
          WHERE CONVERT(varchar(64),HASHBYTES('SHA2_256',LOWER(CONVERT(varchar(320),email_normalized))),2)=@digest
          GROUP BY account_status_code;
          """;
          await using (var r=await cmd.ExecuteReaderAsync()) {
              while(await r.ReadAsync()) Console.WriteLine("LoginLookupStatus="+r.GetString(0)+";Matches="+r.GetInt32(1));
          }
          return 0;
          '@ | Set-Content ./email-diagnostic/Program.cs -Encoding utf8
          dotnet publish ./email-diagnostic/EmailDiagnostic.csproj -c Release -r win-x86 --self-contained false -o ./email-diagnostic-publish
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic build failed." }
          Compress-Archive ./email-diagnostic-publish/* ./email-diagnostic.zip -Force
      - name: Inspect all account matches used by login without sending another email
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pub = az webapp deployment list-publishing-credentials -g recomp_group -n recomp-live | ConvertFrom-Json
          Write-Output "::add-mask::$($pub.publishingPassword)"
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($pub.publishingUserName):$($pub.publishingPassword)"))
          Write-Output "::add-mask::$auth"
          $base = "https://recomp-live.scm.azurewebsites.net"
          $headers = @{Authorization="Basic $auth";"If-Match"="*"}
          Invoke-RestMethod -Uri "$base/api/vfs/data/email-diagnostic.zip" -Method Put -Headers $headers -InFile ./email-diagnostic.zip -ContentType "application/zip" | Out-Null
          $script = @'
          $ErrorActionPreference="Stop"
          $dir="D:\home\data\email-diagnostic"
          Expand-Archive D:\home\data\email-diagnostic.zip $dir -Force
          & "$dir\EmailDiagnostic.exe"
          $code=$LASTEXITCODE
          Start-Sleep -Seconds 8
          $logs=@(Get-ChildItem D:\home\LogFiles -Filter stdout*.log -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 2)
          foreach ($log in $logs) {
              $lines=@(Get-Content $log.FullName -Tail 1000)
              for ($i=0;$i -lt $lines.Count;$i++) {
                  if ($lines[$i] -match 'HttpClient.IEmailService') {
                      for($j=$i;$j -lt [Math]::Min($i+4,$lines.Count);$j++){
                          if($lines[$j] -match 'Received HTTP response headers after .* - ([0-9]{3})'){Write-Output ("MailTransportHTTP="+$Matches[1])}
                      }
                  }
                  if($lines[$i] -match 'Microsoft Graph email send failed. Status ([0-9]{3})'){Write-Output ("GraphFailureHTTP="+$Matches[1])}
                  if($lines[$i] -match '"code"\s*:\s*"([A-Za-z0-9_]+)"'){Write-Output ("ProviderErrorCode="+$Matches[1])}
                  if($lines[$i] -match 'password-reset email transport did not accept'){Write-Output "ResetEmailTransportFailure=True"}
              }
          }
          Remove-Item $dir -Recurse -Force
          Remove-Item D:\home\data\email-diagnostic.zip -Force
          exit $code
          '@
          $encoded=[Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($script))
          $body=@{command="powershell.exe -NoProfile -EncodedCommand $encoded";dir="D:\home"}|ConvertTo-Json
          $result=Invoke-RestMethod -Uri "$base/api/command" -Method Post -Headers $headers -ContentType "application/json" -Body $body
          Write-Host $result.Output
          if ($result.ExitCode -ne 0) { throw "Account diagnostic failed; see sanitized result." }
