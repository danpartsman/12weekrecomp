name: TEMP v1012 stable fat target

on:
  push:
    branches:
      - test
    paths:
      - '.github/workflows/temp-v1012-stable-fat-target.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TEST
        uses: actions/checkout@v7
        with:
          ref: test
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Patch Engine 3.0 stable fat target
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          service_path = Path('src/WebRecomp.Web/Services/Engine30/Engine30PrescriptionService.cs')
          text = service_path.read_text(encoding='utf-8-sig')

          text = text.replace(
              '///   2. Protect an adequate/stable fat floor.\n',
              '///   2. Protect a stable, weight-based fat target.\n')

          old = '''        /*
           * Determine stable fat and the minimum daily macro-energy targets.
           *
           * Fat depends partly on average prescribed energy. If physiological
           * macro floors force the weekly prescription upward, fat may change
           * slightly too. Iterate until the stable-fat / weekly-budget pair
           * converges. With 5g/10kcal rounding this normally settles in one or
           * two passes.
           */
          var weeklyPrescribed =
              requestedWeeklyPrescribed;

          decimal fat = 0m;
          decimal[] carbFloors = [];
          decimal[] minimumDailyTargets = [];

          for (var iteration = 0; iteration < 10; iteration++)
          {
              var averagePrescribed =
                  weeklyPrescribed / 7m;

              var fatFromEnergy =
                  averagePrescribed
                  * 0.20m
                  / 9m;

              var unroundedFatFloor =
                  weightKg * 0.50m;

              /*
               * This is a FLOOR. Normal rounding can move 35.15g down to 35g,
               * which is exactly what the plausibility matrix caught.
               */
              var roundedFatFloor =
                  CeilingToIncrement(
                      unroundedFatFloor,
                      5m);

              var roundedFatFromEnergy =
                  RoundToIncrement(
                      fatFromEnergy,
                      5m);

              fat =
                  Math.Max(
                      roundedFatFromEnergy,
                      roundedFatFloor);

              var fixedKcal =
'''

          new = '''        /*
           * Stable fat is a deliberate weight-based target, not a residual
           * calorie bucket and not a percentage of average prescribed energy.
           *
           * Engine 3.0 keeps fat at 0.50 g/kg (rounded upward to the next 5 g)
           * for the full week. Protein remains stable and carbohydrate is the
           * primary macro that moves with training, glycogen demand, and the
           * category energy policy.
           */
          var weeklyPrescribed =
              requestedWeeklyPrescribed;

          var fat =
              CeilingToIncrement(
                  weightKg * 0.50m,
                  5m);

          decimal[] carbFloors = [];
          decimal[] minimumDailyTargets = [];

          for (var iteration = 0; iteration < 10; iteration++)
          {
              var fixedKcal =
'''

          if old not in text:
              raise SystemExit('stable-fat source anchor not found; refusing unsafe patch')

          text = text.replace(old, new, 1)

          if 'fatFromEnergy' in text or 'roundedFatFromEnergy' in text:
              raise SystemExit('energy-percentage fat logic still present after patch')

          service_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/WebRecomp.Web.Tests/Engine30PrescriptionServiceTests.cs')
          tests = test_path.read_text(encoding='utf-8-sig')

          anchor = '''    [Fact]
          public void FatFloor_IsNeverRoundedBelowHalfGramPerKg()
'''

          regression = '''    [Fact]
          public void StableFat_UsesWeightBasedTarget_NotEnergyPercentage()
          {
              var highEnergyWeek =
                  StandardWeek(
                          equalMaintenance: true)
                      .Select(x =>
                          x with
                          {
                              MaintenanceEnergyKcal = 4000m
                          })
                      .ToArray();

              var result =
                  new Engine30PrescriptionService()
                      .Calculate(
                          "PLAN_2",
                          weightLb: 208m,
                          heightIn: 73m,
                          days: highEnergyWeek);

              Assert.Equal(
                  50m,
                  result.StableFatG);

              Assert.All(
                  result.Days,
                  day =>
                      Assert.Equal(
                          50m,
                          day.FatG));
          }

'''

          if 'StableFat_UsesWeightBasedTarget_NotEnergyPercentage' not in tests:
              if anchor not in tests:
                  raise SystemExit('prescription test anchor not found; refusing unsafe patch')
              tests = tests.replace(anchor, regression + anchor, 1)

          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Verify stable-fat patch markers
        shell: bash
        run: |
          grep -n "Stable fat is a deliberate weight-based target" src/WebRecomp.Web/Services/Engine30/Engine30PrescriptionService.cs
          grep -n "weightKg \* 0.50m" src/WebRecomp.Web/Services/Engine30/Engine30PrescriptionService.cs
          grep -n "StableFat_UsesWeightBasedTarget_NotEnergyPercentage" tests/WebRecomp.Web.Tests/Engine30PrescriptionServiceTests.cs
          if grep -q "fatFromEnergy" src/WebRecomp.Web/Services/Engine30/Engine30PrescriptionService.cs; then
            echo "Old energy-percentage fat logic remains" >&2
            exit 1
          fi

      - name: Restore web project
        run: dotnet restore src/WebRecomp.Web/WebRecomp.Web.csproj

      - name: Restore test project
        run: dotnet restore tests/WebRecomp.Web.Tests/WebRecomp.Web.Tests.csproj

      - name: Build web project
        run: dotnet build src/WebRecomp.Web/WebRecomp.Web.csproj --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test tests/WebRecomp.Web.Tests/WebRecomp.Web.Tests.csproj --configuration Release --no-restore

      - name: Commit tested patch to TEST and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/WebRecomp.Web/Services/Engine30/Engine30PrescriptionService.cs tests/WebRecomp.Web.Tests/Engine30PrescriptionServiceTests.cs
          git rm .github/workflows/temp-v1012-stable-fat-target.yml
          git diff --cached --check
          git commit -m "12WR TEST v1012 — use stable weight-based fat target"
          git push origin HEAD:test
