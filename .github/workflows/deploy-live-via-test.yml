name: Deploy LIVE via TEST Azure trust

on:
  push:
    branches:
      - test
  workflow_dispatch:

concurrency:
  group: recomp-live-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  statuses: write

jobs:
  deploy-live:
    runs-on: windows-latest

    steps:
      - name: Mark LIVE deployment pending
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'live-deploy-via-test',
              description: 'Building main and deploying recomp-live via TEST Azure trust'
            })

      - name: Checkout current LIVE release from main
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up .NET 10
        id: dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore
        id: restore
        run: dotnet restore src/WebRecomp.Web/WebRecomp.Web.csproj

      - name: Build
        id: build
        run: dotnet build src/WebRecomp.Web/WebRecomp.Web.csproj --configuration Release --no-restore

      - name: Run automated tests
        id: test
        run: dotnet test tests/WebRecomp.Web.Tests/WebRecomp.Web.Tests.csproj --configuration Release

      - name: Publish
        id: publish
        run: dotnet publish src/WebRecomp.Web/WebRecomp.Web.csproj --configuration Release --no-build --output ./publish

      - name: Login to Azure
        id: azure_login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3FC67E9AC30B4A5FB2C1C107B84D8B80 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_91AF6C5B8085425781068E9B0080051C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_28C36820998A4A0AB8C5EBB50A54AE0E }}

      - name: LIVE deployment permission probe
        id: preflight
        shell: pwsh
        run: |
          Write-Host "Azure login succeeded. Proceeding directly to recomp-live deployment so deployment permission is tested independently of subscription resource enumeration."
          "stage=direct-deploy" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Deploy to recomp-live
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: recomp-live
          slot-name: Production
          package: ./publish

      - name: Verify LIVE health
        id: health
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $uri = "https://recomp-live.azurewebsites.net/health"
          $healthy = $false

          for ($attempt = 1; $attempt -le 18; $attempt++) {
              try {
                  $response = Invoke-WebRequest -Uri $uri -UseBasicParsing -TimeoutSec 20
                  if ($response.StatusCode -eq 200) {
                      $healthy = $true
                      Write-Host "LIVE health check succeeded."
                      break
                  }
              }
              catch {
                  Write-Host "Health check attempt $attempt did not succeed yet."
              }

              Start-Sleep -Seconds 10
          }

          if (-not $healthy) {
              throw "recomp-live did not return HTTP 200 from /health after deployment."
          }

      - name: Publish LIVE deployment status
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const checks = {
              restore: '${{ steps.restore.outcome }}',
              build: '${{ steps.build.outcome }}',
              test: '${{ steps.test.outcome }}',
              publish: '${{ steps.publish.outcome }}',
              azure_login: '${{ steps.azure_login.outcome }}',
              preflight: '${{ steps.preflight.outcome }}',
              deploy: '${{ steps.deploy.outcome }}',
              health: '${{ steps.health.outcome }}'
            };

            const failed = Object.entries(checks)
              .find(([, outcome]) => outcome && outcome !== 'success');

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: failed ? 'failure' : 'success',
              context: 'live-deploy-via-test',
              description: failed
                ? ('LIVE failed at ' + failed[0]).slice(0, 140)
                : 'recomp-live deployed and health check passed'
            });

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: failed ? 'failure' : 'success',
              context: failed
                ? ('live-deploy-via-test/failure-' + failed[0]).slice(0, 100)
                : 'live-deploy-via-test/verified',
              description: failed
                ? ('LIVE failed at ' + failed[0]).slice(0, 140)
                : 'recomp-live deployed and health check passed'
            });

            if (failed && failed[0] === 'preflight') {
              const stage = '${{ steps.preflight.outputs.stage }}' || 'unknown';
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: 'failure',
                context: ('live-deploy-via-test/preflight-' + stage).slice(0, 100),
                description: ('LIVE preflight failed during ' + stage).slice(0, 140)
              });
            }
