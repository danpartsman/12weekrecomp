name: Build and deploy ASP.NET Core app to Azure Web App - recomp-test

on:
  workflow_dispatch:
  push:
    branches:
      - test

concurrency:
  group: recomp-test-deploy
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: windows-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore web project
        run: dotnet restore src/WebRecomp.Web/WebRecomp.Web.csproj

      - name: Restore test project
        run: dotnet restore tests/WebRecomp.Web.Tests/WebRecomp.Web.Tests.csproj

      - name: Build web project
        run: dotnet build src/WebRecomp.Web/WebRecomp.Web.csproj --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test tests/WebRecomp.Web.Tests/WebRecomp.Web.Tests.csproj --configuration Release --no-restore

      - name: Publish web project
        run: dotnet publish src/WebRecomp.Web/WebRecomp.Web.csproj --configuration Release --no-build --output ./publish

      # TEST deploys directly from the same green runner. Database DDL is not
      # performed by the web process or the normal deployment identity. Native
      # auth enables itself only after its credential schema is provisioned by
      # a deliberately privileged database migration identity.
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3FC67E9AC30B4A5FB2C1C107B84D8B80 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_91AF6C5B8085425781068E9B0080051C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_28C36820998A4A0AB8C5EBB50A54AE0E }}

      - name: Enable TEST startup diagnostics
        shell: pwsh
        run: |
          $resourceGroup = az webapp list --query "[?name=='recomp-test'].resourceGroup | [0]" -o tsv
          if ([string]::IsNullOrWhiteSpace($resourceGroup)) {
              throw "Could not resolve the recomp-test resource group."
          }

          "RECOMP_TEST_RG=$resourceGroup" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          az webapp log config `
              --name recomp-test `
              --resource-group $resourceGroup `
              --application-logging filesystem `
              --level information `
              --web-server-logging filesystem | Out-Null

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: recomp-test
          slot-name: Production
          package: ./publish

      # TEMPORARY end-to-end regression proof for native registration. This
      # uses the real public forms, restarts TEST, and then signs in from a new
      # browser session. The generated password is never printed or persisted.
      - name: Smoke-test native account create restart and return login
        shell: pwsh
        run: |
          $base = "https://test.12weekrecomp.com"
          $email = "authdiag-$('${{ github.sha }}'.Substring(0, 12))@test.com"
          $password = "Diag9!" + [Guid]::NewGuid().ToString("N") + "Aa"

          function Get-Token([string]$html) {
              $match = [regex]::Match($html, 'name="__RequestVerificationToken"[^>]*value="([^"]+)"')
              if (-not $match.Success) {
                  $match = [regex]::Match($html, 'value="([^"]+)"[^>]*name="__RequestVerificationToken"')
              }
              if (-not $match.Success) {
                  throw "Could not find the antiforgery token."
              }
              return $match.Groups[1].Value
          }

          function Wait-TestSite {
              for ($attempt = 1; $attempt -le 15; $attempt++) {
                  try {
                      Invoke-WebRequest -Uri "$base/Account/CreateAccount" -Method Get -TimeoutSec 20 -SkipHttpErrorCheck | Out-Null
                      return
                  }
                  catch {
                      Write-Host "Waiting for TEST after restart ($attempt/15)..."
                      Start-Sleep -Seconds 4
                  }
              }
              throw "TEST did not become reachable after restart."
          }

          Wait-TestSite

          $registerSession = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $registerPage = Invoke-WebRequest -Uri "$base/Account/CreateAccount" -WebSession $registerSession -TimeoutSec 30
          $registerToken = Get-Token $registerPage.Content

          $registerBody = @{
              DisplayName = "Native Auth Diagnostic"
              Email = $email
              Password = $password
              ConfirmPassword = $password
              ReturnUrl = ""
              __RequestVerificationToken = $registerToken
          }

          $registerResponse = Invoke-WebRequest `
              -Uri "$base/Account/CreateAccount" `
              -Method Post `
              -Body $registerBody `
              -WebSession $registerSession `
              -TimeoutSec 30

          if ($registerResponse.StatusCode -ne 200) {
              throw "Native registration did not complete successfully. HTTP $($registerResponse.StatusCode)."
          }

          $encodedEmail = [uri]::EscapeDataString($email)
          $diagUrl = "$base/test-persona/status/local-auth-check?email=$encodedEmail"
          $created = Invoke-RestMethod -Uri $diagUrl -Method Get -TimeoutSec 30

          if ($created.userCount -ne 1 -or -not $created.credentialExists) {
              $created | ConvertTo-Json -Depth 8
              throw "Native registration did not persist both the user and credential rows."
          }

          Write-Host "Native registration persisted successfully. Restarting TEST to prove durability."
          az webapp restart --name recomp-test --resource-group $env:RECOMP_TEST_RG | Out-Null
          Wait-TestSite

          $afterRestart = $null
          for ($attempt = 1; $attempt -le 12; $attempt++) {
              try {
                  $afterRestart = Invoke-RestMethod -Uri $diagUrl -Method Get -TimeoutSec 30
                  if ($afterRestart.userCount -eq 1 -and $afterRestart.credentialExists) {
                      break
                  }
              }
              catch {
                  $null = $_
              }
              Start-Sleep -Seconds 4
          }

          if ($null -eq $afterRestart -or $afterRestart.userCount -ne 1 -or -not $afterRestart.credentialExists) {
              if ($null -ne $afterRestart) {
                  $afterRestart | ConvertTo-Json -Depth 8
              }
              throw "Native account did not survive the TEST restart."
          }

          $loginSession = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $loginPage = Invoke-WebRequest -Uri "$base/Account/SignIn" -WebSession $loginSession -TimeoutSec 30
          $loginToken = Get-Token $loginPage.Content

          $loginBody = @{
              Email = $email
              Password = $password
              RememberMe = "false"
              ReturnUrl = ""
              __RequestVerificationToken = $loginToken
          }

          $loginResponse = Invoke-WebRequest `
              -Uri "$base/Account/SignIn" `
              -Method Post `
              -Body $loginBody `
              -WebSession $loginSession `
              -TimeoutSec 30

          if ($loginResponse.StatusCode -ne 200) {
              throw "Native return login did not complete successfully. HTTP $($loginResponse.StatusCode)."
          }

          $afterLogin = Invoke-RestMethod -Uri $diagUrl -Method Get -TimeoutSec 30
          if ($null -eq $afterLogin.lastSignInAtUtc -or $afterLogin.failedSignInCount -ne 0) {
              $afterLogin | ConvertTo-Json -Depth 8
              throw "Native password validation did not record a successful return login."
          }

          Write-Host "Native account passed create -> restart -> new-session login."
          $afterLogin | ConvertTo-Json -Depth 8

          # A new account must finish the three-step intake and reach Dashboard
          # with today's first weight, even when signup is later in the week.
          $setupPage = Invoke-WebRequest -Uri "$base/Onboarding" -WebSession $loginSession -TimeoutSec 30
          if ($setupPage.Content -notmatch 'Three short steps to get started') {
              throw "New account was not offered the three-step setup."
          }
          $setupToken = Get-Token $setupPage.Content
          $setupBody = @{
              ClientName = "Native Auth Diagnostic"
              StartingWeightLb = "210"
              BirthYear = "1981"
              PreferredTrainingDays = "5"
              PreferredRestDays = "3"
              SexCode = "MALE"
              HeightIn = "73"
              GoalCode = "FAT_LOSS_RECOMP"
              TrainingExperienceCode = "INTERMEDIATE"
              AvailableTrainingDaysWeek = "4"
              TimeZone = "America/Los_Angeles"
              MedicalAcknowledged = "true"
              TrainingAcknowledged = "true"
              TrackingAcknowledged = "true"
              __RequestVerificationToken = $setupToken
          }
          $setupResponse = Invoke-WebRequest -Uri "$base/Onboarding" -Method Post -Body $setupBody -WebSession $loginSession -TimeoutSec 60
          if ($setupResponse.Content -match 'Three short steps to get started' -or $setupResponse.StatusCode -ne 200) {
              throw "Three-step setup did not save; the form was returned or an HTTP error occurred."
          }
          $dashboardResponse = Invoke-WebRequest -Uri "$base/Dashboard" -WebSession $loginSession -TimeoutSec 60
          if ($dashboardResponse.StatusCode -ne 200 -or $dashboardResponse.Content -match 'TEST ERROR DIAGNOSTICS|Three short steps to get started') {
              throw "New account could not reach the Dashboard after today's first weight."
          }
          Write-Host "New-account three-step setup and Dashboard passed."

      # TEMPORARY TEST-ONLY diagnostic for the native account reported by the
      # current tester. The endpoint returns only structural credential state;
      # it never returns the password or stored hash.
      - name: Inspect native TEST account persistence
        shell: pwsh
        run: |
          $url = "https://test.12weekrecomp.com/test-persona/status/local-auth-check?email=testf150%40test.com&v=${{ github.sha }}"
          $lastError = $null

          for ($attempt = 1; $attempt -le 12; $attempt++) {
              try {
                  $result = Invoke-RestMethod -Uri $url -Method Get -TimeoutSec 30
                  Write-Host "Native auth persistence diagnostic:"
                  $result | ConvertTo-Json -Depth 8
                  exit 0
              }
              catch {
                  $lastError = $_.Exception.Message
                  Write-Host "Native auth diagnostic attempt $attempt/12 failed: $lastError"
                  Start-Sleep -Seconds 5
              }
          }

          throw "Native auth persistence diagnostic could not reach TEST: $lastError"

      - name: Verify synthetic TEST personas
        shell: pwsh
        run: |
          $url = "https://test.12weekrecomp.com/test-persona/status?v=${{ github.sha }}"
          $last = $null

          for ($attempt = 1; $attempt -le 12; $attempt++) {
              try {
                  $last = Invoke-RestMethod -Uri $url -Method Get -TimeoutSec 30
                  $notReady = @($last.personas | Where-Object { -not $_.ready })

                  if ($last.environment -eq "TEST" -and
                      $last.personaCount -eq 4 -and
                      $last.ready -eq $true -and
                      $notReady.Count -eq 0) {
                      Write-Host "All four TEST personas are active and analysis-ready."
                      $last | ConvertTo-Json -Depth 8
                      exit 0
                  }

                  Write-Host "Persona seed not ready yet (attempt $attempt/12)."
                  $last | ConvertTo-Json -Depth 8
              }
              catch {
                  Write-Host "Persona status check attempt $attempt/12 failed: $($_.Exception.Message)"
              }

              Start-Sleep -Seconds 5
          }

          if ($null -ne $last) {
              $last | ConvertTo-Json -Depth 8
          }

          throw "TEST persona database verification failed."

      - name: Capture TEST startup diagnostics
        if: failure()
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RECOMP_TEST_RG)) {
              Write-Host "Resource group was not resolved; startup log capture skipped."
              exit 0
          }

          $zipPath = Join-Path $env:RUNNER_TEMP "recomp-test-logs.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "recomp-test-logs"

          try {
              az webapp log download `
                  --name recomp-test `
                  --resource-group $env:RECOMP_TEST_RG `
                  --log-file $zipPath | Out-Null

              if (Test-Path $extractPath) {
                  Remove-Item $extractPath -Recurse -Force
              }

              Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force

              $pattern = "Unhandled exception|fail:|crit:|SqlException|LocalAuth|Scheme already exists|permission|CREATE TABLE|startup"
              $matches = Get-ChildItem $extractPath -Recurse -File |
                  ForEach-Object {
                      try {
                          Select-String -Path $_.FullName -Pattern $pattern -CaseSensitive:$false -ErrorAction Stop
                      }
                      catch {
                          $null
                      }
                  } |
                  Select-Object -Last 200

              if ($matches) {
                  Write-Host "Relevant Azure startup diagnostics:"
                  $matches | ForEach-Object {
                      Write-Host ("{0}:{1}: {2}" -f $_.Path, $_.LineNumber, $_.Line.Trim())
                  }
              }
              else {
                  Write-Host "No matching startup exception lines were found in the downloaded App Service logs."
                  Get-ChildItem $extractPath -Recurse -File |
                      Select-Object -First 50 FullName, Length |
                      Format-Table -AutoSize
              }
          }
          catch {
              Write-Host "Azure startup diagnostic capture failed: $($_.Exception.Message)"
          }
