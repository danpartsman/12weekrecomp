name: Build and deploy ASP.NET Core app to Azure Web App - recomp-test

on:
  workflow_dispatch:
    inputs:
      apply_learning_schema:
        description: 'Apply learning migration 043 using a SQL-authorized deployment identity'
        type: boolean
        required: false
        default: false
  push:
    branches:
      - test

concurrency:
  group: recomp-test-deploy
  cancel-in-progress: true

jobs:
  build-test-deploy:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[seed-test-month-20261023]')
    runs-on: windows-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Honor requested pause before any work
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[pause-test-work]')
        shell: pwsh
        run: |
          Write-Host "TEST deployment and sample-data insert paused at the user's request."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore web project
        run: dotnet restore src/WebRecomp.Web/WebRecomp.Web.csproj

      - name: Restore test project
        run: dotnet restore tests/WebRecomp.Web.Tests/WebRecomp.Web.Tests.csproj

      - name: Build web project
        run: dotnet build src/WebRecomp.Web/WebRecomp.Web.csproj --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test tests/WebRecomp.Web.Tests/WebRecomp.Web.Tests.csproj --configuration Release --no-restore

      - name: Verify accountability preview calculations
        run: node --test tests/accountability-preview.test.cjs

      - name: Verify native nutrition quantity controls and capture previews
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/nutrition-browser" --no-audit --no-fund playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { throw "Could not prepare the browser check." }
          $env:NUTRITION_PLAYWRIGHT_MODULE = "$env:RUNNER_TEMP/nutrition-browser/node_modules/playwright"
          $env:NUTRITION_CHROME_PATH = "$env:ProgramFiles/Google/Chrome/Application/chrome.exe"
          node tests/nutrition-native-quantity.browser.cjs
          if ($LASTEXITCODE -ne 0) { throw "Native nutrition quantity control check failed." }
          node tests/lucia-presentation.browser.cjs
          if ($LASTEXITCODE -ne 0) { throw "Lucia portrait presentation check failed." }
          node tests/coach-portal.browser.cjs
          if ($LASTEXITCODE -ne 0) { throw "Coach portal assignment check failed." }
          node tests/coach-notifications.browser.cjs
          if ($LASTEXITCODE -ne 0) { throw "Phone notification setup check failed." }

      - name: Save native quantity control previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nutrition-native-controls
          path: quantity-control-preview/*.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Publish web project
        run: dotnet publish src/WebRecomp.Web/WebRecomp.Web.csproj --configuration Release --no-build --output ./publish

      # TEST deploys directly from the same green runner. Database DDL is not
      # performed by the web process or the normal deployment identity. Native
      # auth enables itself only after its credential schema is provisioned by
      # a deliberately privileged database migration identity.
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3FC67E9AC30B4A5FB2C1C107B84D8B80 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_91AF6C5B8085425781068E9B0080051C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_28C36820998A4A0AB8C5EBB50A54AE0E }}

      - name: Enable TEST startup diagnostics
        shell: pwsh
        run: |
          $resourceGroup = az webapp list --query "[?name=='recomp-test'].resourceGroup | [0]" -o tsv
          if ([string]::IsNullOrWhiteSpace($resourceGroup)) {
              throw "Could not resolve the recomp-test resource group."
          }

          "RECOMP_TEST_RG=$resourceGroup" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          az webapp config appsettings set `
              --name recomp-test `
              --resource-group $resourceGroup `
              --settings WebRecomp__EnableTestPersonas="false" WebRecomp__BootstrapAdministratorEmailSha256="0618188557cf5bee9c97b08c64f7a748835803dbaf1aa2a5cf3a9f2dd1da60bb" | Out-Null

          az webapp log config `
              --name recomp-test `
              --resource-group $resourceGroup `
              --application-logging filesystem `
              --level information `
              --web-server-logging filesystem | Out-Null


      - name: Apply learning schema with TEST deployment identity
        if: github.event_name == 'workflow_dispatch' && inputs.apply_learning_schema
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ github.ref }}" -ne "refs/heads/test") {
              throw "Learning schema migration is restricted to the TEST branch."
          }

          $connectionString = az webapp config connection-string list `
              --name recomp-test `
              --resource-group $env:RECOMP_TEST_RG `
              --query "[?name=='RecompDatabase'].value | [0]" `
              --output tsv --only-show-errors

          if ($LASTEXITCODE -ne 0) {
              throw "Could not read recomp-test connection settings."
          }

          # Older TEST configuration stores the same .NET setting under
          # App Settings rather than the App Service connection-string list.
          if ([string]::IsNullOrWhiteSpace($connectionString)) {
              $connectionString = az webapp config appsettings list `
                  --name recomp-test `
                  --resource-group $env:RECOMP_TEST_RG `
                  --query "[?name=='ConnectionStrings__RecompDatabase'].value | [0]" `
                  --output tsv --only-show-errors
          }

          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($connectionString)) {
              throw "Could not resolve the recomp-test database connection setting."
          }

          Write-Output "::add-mask::$connectionString"
          $env:RECOMP_RUNTIME_CONNECTION_STRING = $connectionString

          try {
              dotnet run --project tools/WebRecomp.DatabaseMigrator/WebRecomp.DatabaseMigrator.csproj `
                  --configuration Release -- --learning-coach
              if ($LASTEXITCODE -ne 0) {
                  throw "TEST learning schema migration failed. The running application has not been replaced."
              }
          }
          finally {
              Remove-Item Env:RECOMP_RUNTIME_CONNECTION_STRING -ErrorAction SilentlyContinue
          }

      - name: Verify Coach Center foundation and required accountability schema inside TEST
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish tools/WebRecomp.DatabaseMigrator/WebRecomp.DatabaseMigrator.csproj `
              --configuration Release --runtime win-x86 --self-contained true --output ./coach-migration
          if ($LASTEXITCODE -ne 0) { throw "Could not publish Coach Center migration tool." }
          New-Item -ItemType Directory -Path ./coach-migration/database -Force | Out-Null
          Copy-Item database/043_v1015c_learning_coach_foundation.sql ./coach-migration/database/
          Copy-Item database/044_coach_center_foundation.sql ./coach-migration/database/
          Copy-Item database/045_coach_prescription_rules.sql ./coach-migration/database/
          Copy-Item database/046_coach_workout_plan_revisions.sql ./coach-migration/database/
          Compress-Archive -Path ./coach-migration/* -DestinationPath ./coach-migration.zip -Force
          $group = az webapp list --query "[?name=='recomp-test'].resourceGroup | [0]" -o tsv
          if ([string]::IsNullOrWhiteSpace($group)) { throw "Could not resolve TEST resource group." }
          $pub = az webapp deployment list-publishing-credentials --resource-group $group --name recomp-test | ConvertFrom-Json
          if ($null -eq $pub -or [string]::IsNullOrWhiteSpace($pub.publishingPassword)) { throw "TEST deployment credentials unavailable." }
          Write-Output "::add-mask::$($pub.publishingUserName)"
          Write-Output "::add-mask::$($pub.publishingPassword)"
          $auth = az account get-access-token --resource https://management.azure.com/ --query accessToken --output tsv
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($auth)) { throw "TEST deployment access token unavailable." }
          Write-Output "::add-mask::$auth"
          if ([string]::IsNullOrWhiteSpace($pub.scmUri)) { throw "TEST deployment endpoint unavailable." }
          $scm = "https://$(([Uri]$pub.scmUri).Host)"
          Invoke-WebRequest -Uri "$scm/api/vfs/data/coach-migration-${{ github.sha }}.zip" -Method Put `
              -Headers @{ Authorization = "Bearer $auth"; "If-Match" = "*" } -InFile ./coach-migration.zip -ContentType "application/zip" -UseBasicParsing | Out-Null
          $script = @'
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $dir = "D:\home\data\coach-migration-${{ github.sha }}"
          Expand-Archive -Path "$dir.zip" -DestinationPath $dir -Force
          $connection = $env:SQLAZURECONNSTR_RecompDatabase
          if ([string]::IsNullOrWhiteSpace($connection)) { $connection = $env:SQLCONNSTR_RecompDatabase }
          if ([string]::IsNullOrWhiteSpace($connection)) { $connection = $env:CUSTOMCONNSTR_RecompDatabase }
          if ([string]::IsNullOrWhiteSpace($connection)) { $connection = $env:ConnectionStrings__RecompDatabase }
          if ([string]::IsNullOrWhiteSpace($connection)) { throw "TEST database configuration unavailable." }
          $env:RECOMP_RUNTIME_CONNECTION_STRING = $connection
          Set-Location $dir
          & ".\WebRecomp.DatabaseMigrator.exe" --learning-coach --configured-auth 2>&1 | ForEach-Object { Write-Output $_ }
          $result = $LASTEXITCODE
          if ($result -eq 0) {
              $env:RECOMP_EXPECTED_TEST_DATABASE = 'sqldb-recomp'
              & ".\WebRecomp.DatabaseMigrator.exe" --verify-accountability --configured-auth 2>&1 | ForEach-Object { Write-Output $_ }
              $result = $LASTEXITCODE
          }
          Write-Output ("Migration process exit code: " + $result)
          Set-Location "D:\home"
          Remove-Item $dir -Recurse -Force
          Remove-Item "$dir.zip" -Force
          exit $result
          '@
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($script))
          $body = @{ command = "powershell.exe -NoProfile -EncodedCommand $encoded"; dir = "D:\home" } | ConvertTo-Json
          $result = Invoke-RestMethod -Uri "$scm/api/command" -Method Post -Headers @{ Authorization = "Bearer $auth" } -ContentType "application/json" -Body $body
          if ($result.Output) { Write-Host $result.Output }
          if ($result.ExitCode -ne 0) {
              if ($result.Error) { Write-Host $result.Error }
              throw "Coach Center migration failed; existing TEST app has not been replaced."
          }

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: recomp-test
          slot-name: Production
          package: ./publish

      - name: Verify TEST health and native account pages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "https://test.12weekrecomp.com"
          $healthy = $false

          for ($attempt = 1; $attempt -le 18; $attempt++) {
              try {
                  $health = Invoke-WebRequest -Uri "$base/health?v=${{ github.sha }}" -TimeoutSec 20
                  $signIn = Invoke-WebRequest -Uri "$base/Account/SignIn?v=${{ github.sha }}" -TimeoutSec 20
                  $create = Invoke-WebRequest -Uri "$base/Account/CreateAccount?v=${{ github.sha }}" -TimeoutSec 20

                  if ($health.StatusCode -eq 200 -and
                      $signIn.StatusCode -eq 200 -and
                      $create.StatusCode -eq 200 -and
                      $signIn.Content.Contains("Keep me signed in for 7 days") -and
                      $create.Content -match 'Create account &amp; continue|Create account & continue') {
                      $healthy = $true
                      Write-Host "TEST health, native sign-in, and account creation pages passed."
                      break
                  }
              }
              catch {
                  Write-Host "TEST is not ready yet ($attempt/18)."
              }

              Start-Sleep -Seconds 5
          }

          if (-not $healthy) {
              throw "TEST failed health or native account page verification after deployment."
          }

      - name: Verify Command Center shared assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "https://test.12weekrecomp.com"
          function Get-ReadyTestPage([string]$uri) {
              for ($attempt = 1; $attempt -le 6; $attempt++) {
                  try { return Invoke-WebRequest -Uri $uri -TimeoutSec 30 }
                  catch {
                      if ($attempt -eq 6) { throw }
                      Write-Host "TEST endpoint is warming up ($attempt/6); retrying."
                      Start-Sleep -Seconds 5
                  }
              }
          }
          $css = Get-ReadyTestPage "$base/css/dashboard2.css?v=${{ github.sha }}"
          $js = Get-ReadyTestPage "$base/js/dashboard2.js?v=${{ github.sha }}"
          if ($css.StatusCode -ne 200 -or -not $css.Content.Contains(".d2-macros") -or
              $js.StatusCode -ne 200 -or -not $js.Content.Contains("12wr-dashboard2-strategy")) {
              throw "Dashboard2 deployed asset verification failed."
          }
          # No credentials or auth bypass: verify the protected route reaches sign-in.
          $page = Get-ReadyTestPage "$base/CommandCenter"
          if ($page.StatusCode -ne 200 -or
              ($page.Content -notmatch 'Keep me signed in for 7 days|Command Center')) {
              throw "Command Center did not render or reach the normal sign-in page."
          }
          Write-Host "Command Center shared assets and protected route passed. Signed-in visual review remains a separate check."

      - name: Verify Command Center cockpit route and deployed assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "https://test.12weekrecomp.com"
          function Get-ReadyTestPage([string]$uri) {
              for ($attempt = 1; $attempt -le 6; $attempt++) {
                  try { return Invoke-WebRequest -Uri $uri -TimeoutSec 30 }
                  catch {
                      if ($attempt -eq 6) { throw }
                      Write-Host "TEST endpoint is warming up ($attempt/6); retrying."
                      Start-Sleep -Seconds 5
                  }
              }
          }
          $css = Get-ReadyTestPage "$base/css/dashboard3.css?v=${{ github.sha }}"
          $js = Get-ReadyTestPage "$base/js/dashboard3.js?v=${{ github.sha }}"
          if ($css.StatusCode -ne 200 -or -not $css.Content.Contains(".d3-hero") -or
              $js.StatusCode -ne 200 -or -not $js.Content.Contains("data-coach-dialog")) {
              throw "Command Center deployed cockpit asset verification failed."
          }
          $page = Get-ReadyTestPage "$base/CommandCenter"
          if ($page.StatusCode -ne 200 -or
              ($page.Content -notmatch 'Keep me signed in for 7 days|Command Center')) {
              throw "Command Center did not render or reach the normal sign-in page."
          }
          Write-Host "Command Center cockpit assets and protected route passed."

      - name: Verify Today workout and separate daily pages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "https://test.12weekrecomp.com"
          $css = Invoke-WebRequest -Uri "$base/css/today-workout.css?v=${{ github.sha }}" -TimeoutSec 30
          $js = Invoke-WebRequest -Uri "$base/js/body-check.js?v=${{ github.sha }}" -TimeoutSec 30
          if (-not $css.Content.Contains(".tw-body-map") -or -not $js.Content.Contains("data-body-region")) {
              throw "Today workout/body check assets were not deployed."
          }
          foreach ($route in @("TodayWorkout", "DailyEntry", "DailyEntry/CheckIn")) {
              $page = Invoke-WebRequest -Uri "$base/$route" -TimeoutSec 30
              if ($page.StatusCode -ne 200 -or $page.Content -notmatch 'Keep me signed in for 7 days|Today.*Workout|Daily Entries|Scale &amp; Feel') {
                  throw "Protected route failed: $route"
              }
          }
          Write-Host "Today workout assets and protected daily routes passed."

      - name: Verify workout timer and screen-awake assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "https://test.12weekrecomp.com"
          $timer = Invoke-WebRequest -Uri "$base/js/set-timer-v1012.js?v=${{ github.sha }}" -TimeoutSec 30
          $awake = Invoke-WebRequest -Uri "$base/js/rest-timer-v1012.js?v=1012rest3" -TimeoutSec 30
          $loader = Invoke-WebRequest -Uri "$base/js/live-workout-v1012.js?v=${{ github.sha }}" -TimeoutSec 30
          if ($timer.Content -notmatch 'const applyDuration' -or
              $timer.Content -notmatch '130 = 1:30' -or
              $awake.Content -notmatch 'wakeLockPending' -or
              $awake.Content -notmatch 'Screen awake' -or
              $loader.Content -notmatch '1012rest3') {
              throw "Workout timer or screen-awake assets do not match this deployment."
          }
          Write-Host "Numeric timer entry and screen-awake assets verified."

      - name: Report optional learning schema readiness
        shell: pwsh
        run: |
          $state = Invoke-RestMethod `
              -Uri "https://test.12weekrecomp.com/TestDiagnostics/LearningSchemaState" `
              -TimeoutSec 20
          Write-Host ($state | ConvertTo-Json -Compress)

          if ($state.ready -ne $true) {
              Write-Output "::warning::TEST is healthy, but coach learning remains disabled until a database administrator applies migration 043. The deployment identity currently lacks SQL access."
          }

      - name: Verify TEST duplicate admin cleanup
        shell: pwsh
        run: |
          $uri = "https://test.12weekrecomp.com/TestDiagnostics/BootstrapAuthState"
          $state = $null

          for ($attempt = 1; $attempt -le 12; $attempt++) {
              try {
                  $state = Invoke-RestMethod -Uri $uri -TimeoutSec 20
                  if ($null -ne $state) { break }
              }
              catch {
                  Start-Sleep -Seconds 5
              }
          }

          if ($null -eq $state) {
              throw "Could not read TEST bootstrap auth state."
          }

          Write-Host "SANITIZED_TEST_AUTH_STATE"
          Write-Host ($state | ConvertTo-Json -Compress -Depth 4)

      - name: Populate explicitly requested TEST sample month
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[seed-test-month-20261023]')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish tools/WebRecomp.DatabaseMigrator/WebRecomp.DatabaseMigrator.csproj `
              --configuration Release --runtime win-x86 --self-contained false --output ./test-sample-seeder
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the TEST sample-data tool." }
          New-Item -ItemType Directory -Path ./test-sample-seeder/database -Force | Out-Null
          Copy-Item database/test_sample_month.sql ./test-sample-seeder/database/
          Compress-Archive -Path ./test-sample-seeder/* -DestinationPath ./test-sample-seeder.zip -Force
          function Read-RecompConnection([string]$site) {
              $value = az webapp config connection-string list --resource-group $env:RECOMP_TEST_RG --name $site `
                  --query "[?name=='RecompDatabase'].value | [0]" -o tsv --only-show-errors
              if ($LASTEXITCODE -ne 0) { throw "Cannot verify $site database configuration." }
              if ([string]::IsNullOrWhiteSpace($value)) {
                  $value = az webapp config appsettings list --resource-group $env:RECOMP_TEST_RG --name $site `
                      --query "[?name=='ConnectionStrings__RecompDatabase'].value | [0]" -o tsv --only-show-errors
              }
              if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($value)) { throw "Database isolation could not be verified." }
              Write-Output "::add-mask::$value" | Out-Host
              $parsed = [System.Data.Common.DbConnectionStringBuilder]::new()
              $parsed.set_ConnectionString([string]($value -join "`n"))
              $database = if ($parsed.ContainsKey('Initial Catalog')) { [string]$parsed['Initial Catalog'] } else { [string]$parsed['Database'] }
              $server = if ($parsed.ContainsKey('Data Source')) { [string]$parsed['Data Source'] } else { [string]$parsed['Server'] }
              if ([string]::IsNullOrWhiteSpace($database) -or [string]::IsNullOrWhiteSpace($server)) { throw "Cannot resolve database identity." }
              return @{ Database = $database; Server = $server.ToLowerInvariant().Replace('tcp:', '').Replace(',1433','').Trim() }
          }
          $testDb = Read-RecompConnection 'recomp-test'
          # Confirmed by successful deployment logs: LIVE uses sqldb-recomp-live;
          # TEST uses sqldb-recomp. The TEST identity does not need LIVE secrets.
          if ($testDb.Database -ne 'sqldb-recomp' -or $testDb.Database -eq 'sqldb-recomp-live') {
              throw "Unexpected TEST database. No sample data will be inserted."
          }
          Write-Host "Verified the configured TEST database is sqldb-recomp, separate from LIVE sqldb-recomp-live."
          $pub = az webapp deployment list-publishing-credentials --resource-group $env:RECOMP_TEST_RG --name recomp-test | ConvertFrom-Json
          $auth = az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($auth) -or [string]::IsNullOrWhiteSpace($pub.scmUri)) { throw "TEST deployment access unavailable." }
          Write-Output "::add-mask::$auth"
          $scm = "https://$(([Uri]$pub.scmUri).Host)"
          $headers = @{ Authorization = "Bearer $auth" }
          Invoke-WebRequest -Uri "$scm/api/vfs/data/test-sample-${{ github.sha }}.zip" -Method Put `
              -Headers @{ Authorization = "Bearer $auth"; "If-Match" = "*" } -InFile ./test-sample-seeder.zip -ContentType "application/zip" -UseBasicParsing | Out-Null
          $script = @'
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          if ($env:WEBSITE_SITE_NAME -ne 'recomp-test') { throw "Sample data is restricted to recomp-test." }
          $connection = $env:SQLAZURECONNSTR_RecompDatabase
          if ([string]::IsNullOrWhiteSpace($connection)) { $connection = $env:SQLCONNSTR_RecompDatabase }
          if ([string]::IsNullOrWhiteSpace($connection)) { $connection = $env:CUSTOMCONNSTR_RecompDatabase }
          if ([string]::IsNullOrWhiteSpace($connection)) { $connection = $env:ConnectionStrings__RecompDatabase }
          if ([string]::IsNullOrWhiteSpace($connection)) { throw "TEST database configuration missing." }
          $env:RECOMP_RUNTIME_CONNECTION_STRING = $connection
          $env:RECOMP_EXPECTED_TEST_DATABASE = '__EXPECTED_DATABASE__'
          $dir = "D:\home\data\test-sample-${{ github.sha }}"
          try {
              Expand-Archive -Path "$dir.zip" -DestinationPath $dir -Force
              Set-Location $dir
              & '.\WebRecomp.DatabaseMigrator.exe' --test-sample-data --configured-auth
              if ($LASTEXITCODE -ne 0) { throw "TEST sample-data insert failed." }
              Write-Output "Verifying repeat execution adds no duplicate sample entries:"
              & '.\WebRecomp.DatabaseMigrator.exe' --test-sample-data --configured-auth
              if ($LASTEXITCODE -ne 0) { throw "TEST sample-data verification failed." }
          }
          finally {
              Set-Location 'D:\home'
              Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item "$dir.zip" -Force -ErrorAction SilentlyContinue
          }
          '@
          $script = $script.Replace('__EXPECTED_DATABASE__', $testDb.Database.Replace("'", "''"))
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($script))
          $body = @{ command = "powershell.exe -NoProfile -EncodedCommand $encoded"; dir = "D:\home" } | ConvertTo-Json
          $result = Invoke-RestMethod -Uri "$scm/api/command" -Method Post -Headers $headers -ContentType "application/json" -Body $body
          if ($result.Output) { Write-Host $result.Output }
          if ($result.ExitCode -ne 0) { throw "TEST sample-data job failed; inspect the batch result." }

      - name: Capture TEST startup diagnostics
        if: failure()
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RECOMP_TEST_RG)) {
              Write-Host "Resource group was not resolved; startup log capture skipped."
              exit 0
          }

          $zipPath = Join-Path $env:RUNNER_TEMP "recomp-test-logs.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "recomp-test-logs"

          try {
              az webapp log download `
                  --name recomp-test `
                  --resource-group $env:RECOMP_TEST_RG `
                  --log-file $zipPath | Out-Null

              if (Test-Path $extractPath) {
                  Remove-Item $extractPath -Recurse -Force
              }

              Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force

              $pattern = "Unhandled exception|fail:|crit:|SqlException|LocalAuth|Scheme already exists|permission|CREATE TABLE|startup"
              $matches = Get-ChildItem $extractPath -Recurse -File |
                  ForEach-Object {
                      try {
                          Select-String -Path $_.FullName -Pattern $pattern -CaseSensitive:$false -ErrorAction Stop
                      }
                      catch {
                          $null
                      }
                  } |
                  Select-Object -Last 200

              if ($matches) {
                  Write-Host "Relevant Azure startup diagnostics:"
                  $matches | ForEach-Object {
                      Write-Host ("{0}:{1}: {2}" -f $_.Path, $_.LineNumber, $_.Line.Trim())
                  }
              }
              else {
                  Write-Host "No matching startup exception lines were found in the downloaded App Service logs."
                  Get-ChildItem $extractPath -Recurse -File |
                      Select-Object -First 50 FullName, Length |
                      Format-Table -AutoSize
              }
          }
          catch {
              Write-Host "Azure startup diagnostic capture failed: $($_.Exception.Message)"
          }


  seed-requested-sample-month:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[seed-test-month-20261023]')
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3FC67E9AC30B4A5FB2C1C107B84D8B80 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_91AF6C5B8085425781068E9B0080051C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_28C36820998A4A0AB8C5EBB50A54AE0E }}

      - name: Resolve TEST resource group
        shell: pwsh
        run: |
          $group = az webapp list --query "[?name=='recomp-test'].resourceGroup | [0]" -o tsv
          if ([string]::IsNullOrWhiteSpace($group)) { throw "Cannot resolve TEST resource group." }
          "RECOMP_TEST_RG=$group" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Populate explicitly requested TEST sample month
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[seed-test-month-20261023]')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish tools/WebRecomp.DatabaseMigrator/WebRecomp.DatabaseMigrator.csproj `
              --configuration Release --runtime win-x86 --self-contained false --output ./test-sample-seeder
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the TEST sample-data tool." }
          New-Item -ItemType Directory -Path ./test-sample-seeder/database -Force | Out-Null
          Copy-Item database/test_sample_month.sql ./test-sample-seeder/database/
          Compress-Archive -Path ./test-sample-seeder/* -DestinationPath ./test-sample-seeder.zip -Force
          function Read-RecompConnection([string]$site) {
              $value = az webapp config connection-string list --resource-group $env:RECOMP_TEST_RG --name $site `
                  --query "[?name=='RecompDatabase'].value | [0]" -o tsv --only-show-errors
              if ($LASTEXITCODE -ne 0) { throw "Cannot verify $site database configuration." }
              if ([string]::IsNullOrWhiteSpace($value)) {
                  $value = az webapp config appsettings list --resource-group $env:RECOMP_TEST_RG --name $site `
                      --query "[?name=='ConnectionStrings__RecompDatabase'].value | [0]" -o tsv --only-show-errors
              }
              if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($value)) { throw "Database isolation could not be verified." }
              Write-Output "::add-mask::$value" | Out-Host
              $parsed = [System.Data.Common.DbConnectionStringBuilder]::new()
              $parsed.set_ConnectionString([string]($value -join "`n"))
              $database = if ($parsed.ContainsKey('Initial Catalog')) { [string]$parsed['Initial Catalog'] } else { [string]$parsed['Database'] }
              $server = if ($parsed.ContainsKey('Data Source')) { [string]$parsed['Data Source'] } else { [string]$parsed['Server'] }
              if ([string]::IsNullOrWhiteSpace($database) -or [string]::IsNullOrWhiteSpace($server)) { throw "Cannot resolve database identity." }
              return @{ Database = $database; Server = $server.ToLowerInvariant().Replace('tcp:', '').Replace(',1433','').Trim() }
          }
          $testDb = Read-RecompConnection 'recomp-test'
          # Confirmed by successful deployment logs: LIVE uses sqldb-recomp-live;
          # TEST uses sqldb-recomp. The TEST identity does not need LIVE secrets.
          if ($testDb.Database -ne 'sqldb-recomp' -or $testDb.Database -eq 'sqldb-recomp-live') {
              throw "Unexpected TEST database. No sample data will be inserted."
          }
          Write-Host "Verified the configured TEST database is sqldb-recomp, separate from LIVE sqldb-recomp-live."
          $pub = az webapp deployment list-publishing-credentials --resource-group $env:RECOMP_TEST_RG --name recomp-test | ConvertFrom-Json
          $auth = az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($auth) -or [string]::IsNullOrWhiteSpace($pub.scmUri)) { throw "TEST deployment access unavailable." }
          Write-Output "::add-mask::$auth"
          $scm = "https://$(([Uri]$pub.scmUri).Host)"
          $headers = @{ Authorization = "Bearer $auth" }
          Invoke-WebRequest -Uri "$scm/api/vfs/data/test-sample-${{ github.sha }}.zip" -Method Put `
              -Headers @{ Authorization = "Bearer $auth"; "If-Match" = "*" } -InFile ./test-sample-seeder.zip -ContentType "application/zip" -UseBasicParsing | Out-Null
          $script = @'
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          if ($env:WEBSITE_SITE_NAME -ne 'recomp-test') { throw "Sample data is restricted to recomp-test." }
          $connection = $env:SQLAZURECONNSTR_RecompDatabase
          if ([string]::IsNullOrWhiteSpace($connection)) { $connection = $env:SQLCONNSTR_RecompDatabase }
          if ([string]::IsNullOrWhiteSpace($connection)) { $connection = $env:CUSTOMCONNSTR_RecompDatabase }
          if ([string]::IsNullOrWhiteSpace($connection)) { $connection = $env:ConnectionStrings__RecompDatabase }
          if ([string]::IsNullOrWhiteSpace($connection)) { throw "TEST database configuration missing." }
          $env:RECOMP_RUNTIME_CONNECTION_STRING = $connection
          $env:RECOMP_EXPECTED_TEST_DATABASE = '__EXPECTED_DATABASE__'
          $dir = "D:\home\data\test-sample-${{ github.sha }}"
          try {
              Expand-Archive -Path "$dir.zip" -DestinationPath $dir -Force
              Set-Location $dir
              & '.\WebRecomp.DatabaseMigrator.exe' --test-sample-data --configured-auth
              if ($LASTEXITCODE -ne 0) { throw "TEST sample-data insert failed." }
              Write-Output "Verifying repeat execution adds no duplicate sample entries:"
              & '.\WebRecomp.DatabaseMigrator.exe' --test-sample-data --configured-auth
              if ($LASTEXITCODE -ne 0) { throw "TEST sample-data verification failed." }
          }
          finally {
              Set-Location 'D:\home'
              Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item "$dir.zip" -Force -ErrorAction SilentlyContinue
          }
          '@
          $script = $script.Replace('__EXPECTED_DATABASE__', $testDb.Database.Replace("'", "''"))
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($script))
          $body = @{ command = "powershell.exe -NoProfile -EncodedCommand $encoded"; dir = "D:\home" } | ConvertTo-Json
          $result = Invoke-RestMethod -Uri "$scm/api/command" -Method Post -Headers $headers -ContentType "application/json" -Body $body
          if ($result.Output) { Write-Host $result.Output }
          if ($result.ExitCode -ne 0) { throw "TEST sample-data job failed; inspect the batch result." }

