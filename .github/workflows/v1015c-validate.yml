name: v1015c branch validation

on:
  push:
    branches:
      - v1015c-learning-coach
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore web
        run: dotnet restore src/WebRecomp.Web/WebRecomp.Web.csproj

      - name: Restore tests
        run: dotnet restore tests/WebRecomp.Web.Tests/WebRecomp.Web.Tests.csproj

      - name: Build
        run: dotnet build src/WebRecomp.Web/WebRecomp.Web.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/WebRecomp.Web.Tests/WebRecomp.Web.Tests.csproj --configuration Release --no-restore
