name: Assess LIVE agreement fees

on:
  schedule:
    - cron: '1 0 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: recomp-live-agreement-fees
  cancel-in-progress: false

jobs:
  settle:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: azure/login@v2
        with:
          client-id: a81057ec-568b-4cec-9a95-1d4d3ff549a0
          tenant-id: e5e2dff4-ed49-4038-95d0-63d75304d52e
          subscription-id: 14564a14-42f9-4d2e-8a0b-a7c844dfb5c0
      - name: Assess closed daily periods and weekly fees due today
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $site = 'recomp-live'
          $pub = az webapp deployment list-publishing-credentials -g recomp_group -n $site | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$pub.scmUri) { throw 'App maintenance endpoint unavailable.' }
          $auth = az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv
          if ($LASTEXITCODE -ne 0 -or !$auth) { throw 'App maintenance authorization unavailable.' }
          Write-Output "::add-mask::$auth"
          $scm = "https://$(([Uri]$pub.scmUri).Host)"
          $script = @'
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          if ($env:WEBSITE_SITE_NAME -ne 'recomp-live') { throw 'App identity mismatch.' }
          $siteUrl = 'https://recomp-live.azurewebsites.net'
          Invoke-WebRequest -Uri "$siteUrl/health" -UseBasicParsing -TimeoutSec 60 | Out-Null
          $dataPath = $env:Notifications__DataPath
          if (!$dataPath) { $dataPath = Join-Path $env:HOME 'data\coach-notifications' }
          $keyPath = Join-Path $dataPath 'job-key.txt'
          if (!(Test-Path $keyPath)) { throw 'Fee assessment authorization has not been initialized.' }
          $key = (Get-Content $keyPath -Raw).Trim()
          try {
              $result = Invoke-RestMethod -Uri "$siteUrl/notifications/settle-agreement-fees" -Method Post -Headers @{'X-12WR-Notification-Job'=$key} -TimeoutSec 150
          } catch {
              throw 'LIVE agreement fee assessment failed. Check the application logs for details.'
          }
          if ($null -eq $result.posted) { throw 'LIVE did not return a fee assessment result.' }
          Write-Output "LIVE agreement fee ledger entries posted: $($result.posted)"
          Write-Output "LIVE task deadline penalties posted: $($result.taskPenalties)"
          '@
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($script))
          $body = @{command="powershell.exe -NoProfile -EncodedCommand $encoded";dir='D:\home'} | ConvertTo-Json
          $result = Invoke-RestMethod -Uri "$scm/api/command" -Method Post -Headers @{Authorization="Bearer $auth"} -ContentType 'application/json' -Body $body
          Write-Host $result.Output
          if ($result.ExitCode -ne 0) { throw 'LIVE agreement fee assessment did not complete.' }
