name: Deploy 12WR LIVE

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: recomp-live-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AZURE_WEBAPP_NAME: recomp-live
  AZURE_RESOURCE_GROUP: recomp_group
  AZURE_CLIENT_ID: a81057ec-568b-4cec-9a95-1d4d3ff549a0
  AZURE_TENANT_ID: e5e2dff4-ed49-4038-95d0-63d75304d52e
  AZURE_SUBSCRIPTION_ID: 14564a14-42f9-4d2e-8a0b-a7c844dfb5c0
  WEB_PROJECT: src/WebRecomp.Web/WebRecomp.Web.csproj
  TEST_PROJECT: tests/WebRecomp.Web.Tests/WebRecomp.Web.Tests.csproj

jobs:
  build-test-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore web project
        run: dotnet restore ${{ env.WEB_PROJECT }}

      - name: Restore test project
        run: dotnet restore ${{ env.TEST_PROJECT }}

      - name: Build web project
        run: dotnet build ${{ env.WEB_PROJECT }} --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test ${{ env.TEST_PROJECT }} --configuration Release --no-restore

      - name: Publish web project
        run: dotnet publish ${{ env.WEB_PROJECT }} --configuration Release --no-build --output ./publish

      - name: Stamp LIVE release
        shell: pwsh
        run: |
          @(
              "12 Week Recomp LIVE release"
              "source_branch=${{ github.ref_name }}"
              "source_sha=${{ github.sha }}"
              "deployment_run=${{ github.run_id }}"
              "built_at_utc=$([DateTime]::UtcNow.ToString('o'))"
          ) | Set-Content -Path "./publish/release-version.txt" -Encoding utf8

      - name: Create deployment ZIP
        shell: pwsh
        run: |
          if (Test-Path ./publish.zip) {
              Remove-Item ./publish.zip -Force
          }
          Compress-Archive -Path ./publish/* -DestinationPath ./publish.zip -Force

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Verify LIVE database configuration
        shell: pwsh
        run: |
          $name = az webapp config connection-string list `
            --resource-group $env:AZURE_RESOURCE_GROUP `
            --name $env:AZURE_WEBAPP_NAME `
            --query "[?name=='RecompDatabase'].name | [0]" `
            -o tsv

          if ([string]::IsNullOrWhiteSpace($name)) {
              throw "LIVE is missing the required RecompDatabase connection-string setting. Deployment stopped before replacing the running site."
          }

          Write-Host "Required RecompDatabase connection-string setting is present."

      - name: Apply LIVE learning schema inside App Service
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish tools/WebRecomp.DatabaseMigrator/WebRecomp.DatabaseMigrator.csproj `
              --configuration Release --runtime win-x86 --self-contained false `
              --output ./learning-migration
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the learning migration tool." }
          New-Item -ItemType Directory -Path ./learning-migration/database -Force | Out-Null
          Copy-Item database/043_v1015c_learning_coach_foundation.sql ./learning-migration/database/
          Compress-Archive -Path ./learning-migration/* -DestinationPath ./learning-migration.zip -Force

          $pub = az webapp deployment list-publishing-credentials `
              --resource-group $env:AZURE_RESOURCE_GROUP `
              --name $env:AZURE_WEBAPP_NAME | ConvertFrom-Json
          if ($null -eq $pub -or [string]::IsNullOrWhiteSpace($pub.publishingPassword)) {
              throw "Could not obtain App Service deployment credentials."
          }
          Write-Output "::add-mask::$($pub.publishingUserName)"
          Write-Output "::add-mask::$($pub.publishingPassword)"
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(
              "$($pub.publishingUserName):$($pub.publishingPassword)"))
          Write-Output "::add-mask::$auth"
          $headers = @{ Authorization = "Basic $auth"; "If-Match" = "*" }
          $scm = "https://$($env:AZURE_WEBAPP_NAME).scm.azurewebsites.net"
          $cleanupScript = @'
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $packages = "D:\home\data\SitePackages"
          $active = (Get-Content (Join-Path $packages "packagename.txt") -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($active) -or !(Test-Path (Join-Path $packages $active))) {
              throw "Cannot verify the active package; deployment cleanup stopped."
          }
          $keep = @($active, "12wr-4a9c747e4da28167bb4c1947e8d9dc42ea3e878e.zip", "12wr-64c13e864f7cc0e0343a8d5d987dbeba6b91d551.zip")
          Write-Output ("Preserving active package: " + $active)
          Get-ChildItem $packages -File | ForEach-Object {
              Write-Output ("Package inventory: " + $_.Name + " bytes=" + $_.Length)
              if ($_.Name -match '^12wr-[0-9a-f]{40}\.zip
          $cleanupEncoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($cleanupScript))
          $cleanupBody = @{ command = "powershell.exe -NoProfile -EncodedCommand $cleanupEncoded"; dir = "D:\home" } | ConvertTo-Json
          $cleanupResult = Invoke-RestMethod -Uri "$scm/api/command" -Method Post `
              -Headers @{ Authorization = "Basic $auth" } -ContentType "application/json" -Body $cleanupBody
          if ($cleanupResult.ExitCode -ne 0) { throw "Could not clean temporary migration files." }
          if ($cleanupResult.Output) { Write-Host $cleanupResult.Output }
          Invoke-WebRequest -Uri "$scm/api/vfs/data/learning-migration-${{ github.sha }}.zip" `
              -Method Put -Headers $headers -InFile ./learning-migration.zip `
              -ContentType "application/zip" -UseBasicParsing | Out-Null

          $migrationScript = @'
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $migrationDir = "D:\home\data\learning-migration-${{ github.sha }}"
          Expand-Archive -Path "D:\home\data\learning-migration-${{ github.sha }}.zip" -DestinationPath $migrationDir -Force
          $connection = $env:SQLAZURECONNSTR_RecompDatabase
          if ([string]::IsNullOrWhiteSpace($connection)) { $connection = $env:SQLCONNSTR_RecompDatabase }
          if ([string]::IsNullOrWhiteSpace($connection)) { $connection = $env:CUSTOMCONNSTR_RecompDatabase }
          if ([string]::IsNullOrWhiteSpace($connection)) { $connection = $env:ConnectionStrings__RecompDatabase }
          if ([string]::IsNullOrWhiteSpace($connection)) { throw "LIVE database connection is unavailable in the App Service migration context." }
          $env:RECOMP_RUNTIME_CONNECTION_STRING = $connection
          Set-Location $migrationDir
          & ".\WebRecomp.DatabaseMigrator.exe" --learning-coach --configured-auth
          exit $LASTEXITCODE
          '@
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($migrationScript))
          $body = @{ command = "powershell.exe -NoProfile -EncodedCommand $encoded"; dir = "D:\home" } | ConvertTo-Json
          $result = Invoke-RestMethod -Uri "$scm/api/command" -Method Post `
              -Headers @{ Authorization = "Basic $auth" } -ContentType "application/json" -Body $body
          if ($result.Output) { Write-Host $result.Output }
          if ($result.ExitCode -ne 0) {
              if ($result.Error) { Write-Host $result.Error }
              throw "App Service learning schema migration failed. The running app has not been replaced."
          }

      - name: Configure LIVE run-from-package deployment
        shell: pwsh
        run: |
          az webapp config appsettings set `
            --resource-group $env:AZURE_RESOURCE_GROUP `
            --name $env:AZURE_WEBAPP_NAME `
            --settings WEBSITE_RUN_FROM_PACKAGE="1" SCM_DO_BUILD_DURING_DEPLOYMENT="false" `
            --output none

          az webapp config appsettings delete `
            --resource-group $env:AZURE_RESOURCE_GROUP `
            --name $env:AZURE_WEBAPP_NAME `
            --setting-names PROJECT `
            --output none 2>$null

      - name: Install package directly in SitePackages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $pub = az webapp deployment list-publishing-credentials `
            --resource-group $env:AZURE_RESOURCE_GROUP `
            --name $env:AZURE_WEBAPP_NAME | ConvertFrom-Json

          if ($null -eq $pub -or
              [string]::IsNullOrWhiteSpace($pub.publishingUserName) -or
              [string]::IsNullOrWhiteSpace($pub.publishingPassword)) {
              throw "Could not obtain App Service publishing credentials."
          }

          Write-Output "::add-mask::$($pub.publishingUserName)"
          Write-Output "::add-mask::$($pub.publishingPassword)"

          $pair = "$($pub.publishingUserName):$($pub.publishingPassword)"
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($pair))

          $headers = @{
              Authorization = "Basic $auth"
              "If-Match" = "*"
          }

          # Remove only superseded generated deployment packages and temporary staging.
          # Preserve the active release, known successful rollback releases, and application data.
          $cleanupScript = @'
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $packages = "D:\home\data\SitePackages"
          $active = (Get-Content (Join-Path $packages "packagename.txt") -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($active) -or !(Test-Path (Join-Path $packages $active))) {
              throw "Cannot verify the active package; deployment cleanup stopped."
          }
          $keep = @($active, "12wr-4a9c747e4da28167bb4c1947e8d9dc42ea3e878e.zip", "12wr-64c13e864f7cc0e0343a8d5d987dbeba6b91d551.zip")
          Write-Output ("Preserving active package: " + $active)
          Get-ChildItem $packages -File | ForEach-Object {
              Write-Output ("Package inventory: " + $_.Name + " bytes=" + $_.Length)
              if ($_.Name -match '^12wr-[0-9a-f]{40}\.zip
          $encodedCleanup = [Convert]::ToBase64String(
              [Text.Encoding]::Unicode.GetBytes($cleanupScript)
          )

          $commandBody = @{
              command = "powershell.exe -NoProfile -EncodedCommand $encodedCleanup"
              dir = "D:\home"
          } | ConvertTo-Json

          $commandHeaders = @{
              Authorization = "Basic $auth"
          }

          $cleanupResult = Invoke-RestMethod `
            -Uri "https://$($env:AZURE_WEBAPP_NAME).scm.azurewebsites.net/api/command" `
            -Method Post `
            -Headers $commandHeaders `
            -ContentType "application/json" `
            -Body $commandBody

          if ($cleanupResult.Output) {
              Write-Host $cleanupResult.Output
          }

          $packageName = "12wr-${{ github.sha }}.zip"
          $base = "https://$($env:AZURE_WEBAPP_NAME).scm.azurewebsites.net/api/vfs/data/SitePackages"

          Invoke-WebRequest `
            -Uri "$base/$packageName" `
            -Method Put `
            -Headers $headers `
            -InFile "./publish.zip" `
            -ContentType "application/zip" `
            -UseBasicParsing | Out-Null

          Invoke-WebRequest `
            -Uri "$base/packagename.txt" `
            -Method Put `
            -Headers $headers `
            -Body $packageName `
            -ContentType "text/plain" `
            -UseBasicParsing | Out-Null

          Write-Host "Installed $packageName into SitePackages and updated packagename.txt."

          az webapp restart `
            --resource-group $env:AZURE_RESOURCE_GROUP `
            --name $env:AZURE_WEBAPP_NAME `
            --output none

      - name: Verify LIVE health and release marker
        shell: pwsh
        run: |
          $base = "https://recomp-live.azurewebsites.net"
          $healthy = $false

          for ($attempt = 1; $attempt -le 24; $attempt++) {
              try {
                  $health = Invoke-WebRequest -Uri "$base/health?v=${{ github.sha }}" -UseBasicParsing -TimeoutSec 20
                  $marker = Invoke-WebRequest -Uri "$base/release-version.txt?v=${{ github.sha }}" -UseBasicParsing -TimeoutSec 20

                  if ($health.StatusCode -eq 200 -and
                      $marker.StatusCode -eq 200 -and
                      $marker.Content.Contains("${{ github.sha }}")) {
                      Write-Host "LIVE health check passed."
                      Write-Host $health.Content
                      Write-Host "LIVE release marker matches this deployment:"
                      Write-Host $marker.Content
                      $healthy = $true
                      break
                  }

                  if ($marker.StatusCode -eq 200) {
                      Write-Host "LIVE is responding, but the release marker does not yet match ${{ github.sha }}."
                  }
              }
              catch {
                  Write-Host "LIVE verification attempt $attempt/24 not ready yet: $($_.Exception.Message)"
              }

              Start-Sleep -Seconds 10
          }

          if (-not $healthy) {
              throw "recomp-live did not pass health + release marker verification after deployment."
          }

      - name: Verify LIVE account creation and sign-in
        shell: pwsh
        run: |
          $base = "https://recomp-live.azurewebsites.net"
          $create = Invoke-WebRequest -Uri "$base/Account/CreateAccount?v=${{ github.sha }}" -UseBasicParsing -TimeoutSec 30
          $signIn = Invoke-WebRequest -Uri "$base/Account/SignIn?v=${{ github.sha }}" -UseBasicParsing -TimeoutSec 30

          if ($create.StatusCode -ne 200 -or $signIn.StatusCode -ne 200) {
              throw "LIVE account pages did not return HTTP 200."
          }

          if ($create.Content -notmatch 'Create account &amp; continue|Create account & continue') {
              throw "LIVE native account creation form is not enabled."
          }

          if ($signIn.Content -notmatch 'Keep me signed in for 7 days') {
              throw "LIVE native sign-in form is not enabled."
          }

          $forbidden = @(
              'TEST credential',
              'Existing TEST',
              'TEST personas',
              'legacy Microsoft',
              'temporarily unavailable'
          )

          foreach ($phrase in $forbidden) {
              if ($create.Content -match [regex]::Escape($phrase) -or
                  $signIn.Content -match [regex]::Escape($phrase)) {
                  throw "LIVE auth page contains forbidden non-production text: $phrase"
              }
          }

          Write-Host "LIVE account creation and sign-in pages are enabled and production-clean."

 -and $keep -notcontains $_.Name) {
                  Write-Output ("Removing superseded or failed deployment package: " + $_.Name)
                  Remove-Item $_.FullName -Force
              }
          }
          Get-ChildItem "D:\home\data" | Where-Object {
              $_.Name -match '^learning-migration-[0-9a-f]{40}(\.zip)?
          $encodedCleanup = [Convert]::ToBase64String(
              [Text.Encoding]::Unicode.GetBytes($cleanupScript)
          )

          $commandBody = @{
              command = "powershell.exe -NoProfile -EncodedCommand $encodedCleanup"
              dir = "D:\home"
          } | ConvertTo-Json

          $commandHeaders = @{
              Authorization = "Basic $auth"
          }

          $cleanupResult = Invoke-RestMethod `
            -Uri "https://$($env:AZURE_WEBAPP_NAME).scm.azurewebsites.net/api/command" `
            -Method Post `
            -Headers $commandHeaders `
            -ContentType "application/json" `
            -Body $commandBody

          if ($cleanupResult.Output) {
              Write-Host $cleanupResult.Output
          }

          $packageName = "12wr-${{ github.sha }}.zip"
          $base = "https://$($env:AZURE_WEBAPP_NAME).scm.azurewebsites.net/api/vfs/data/SitePackages"

          Invoke-WebRequest `
            -Uri "$base/$packageName" `
            -Method Put `
            -Headers $headers `
            -InFile "./publish.zip" `
            -ContentType "application/zip" `
            -UseBasicParsing | Out-Null

          Invoke-WebRequest `
            -Uri "$base/packagename.txt" `
            -Method Put `
            -Headers $headers `
            -Body $packageName `
            -ContentType "text/plain" `
            -UseBasicParsing | Out-Null

          Write-Host "Installed $packageName into SitePackages and updated packagename.txt."

          az webapp restart `
            --resource-group $env:AZURE_RESOURCE_GROUP `
            --name $env:AZURE_WEBAPP_NAME `
            --output none

