name: Deliver coach notifications and daily reminders
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/coach-notification-delivery.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: coach-notification-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: azure/login@v2
        with:
          client-id: a81057ec-568b-4cec-9a95-1d4d3ff549a0
          tenant-id: e5e2dff4-ed49-4038-95d0-63d75304d52e
          subscription-id: 14564a14-42f9-4d2e-8a0b-a7c844dfb5c0
      - name: Run authorized LIVE delivery without exposing its job token
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pub = az webapp deployment list-publishing-credentials -g recomp_group -n recomp-live | ConvertFrom-Json
          Write-Output "::add-mask::$($pub.publishingPassword)"
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($pub.publishingUserName):$($pub.publishingPassword)"))
          Write-Output "::add-mask::$auth"
          $script = @'
          $ErrorActionPreference="Stop"
          Invoke-WebRequest -Uri "https://recomp-live.azurewebsites.net/health" -UseBasicParsing -TimeoutSec 60 | Out-Null
          $keyPath=Join-Path $env:HOME "data\coach-notifications\job-key.txt"
          if (!(Test-Path $keyPath)) { Write-Output "Notifications are not initialized yet; next scheduled run will retry."; exit 0 }
          $key=(Get-Content $keyPath -Raw).Trim()
          $result=Invoke-RestMethod -Uri "https://recomp-live.azurewebsites.net/notifications/run" -Method Post -Headers @{"X-12WR-Notification-Job"=$key} -TimeoutSec 120
          Write-Output ("Notification processing complete=" + $result.processed)
          '@
          $encoded=[Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($script))
          $body=@{command="powershell.exe -NoProfile -EncodedCommand $encoded";dir="D:\home"}|ConvertTo-Json
          $result=Invoke-RestMethod -Uri "https://recomp-live.scm.azurewebsites.net/api/command" -Method Post -Headers @{Authorization="Basic $auth"} -ContentType "application/json" -Body $body
          Write-Host $result.Output
          if ($result.ExitCode -ne 0) { throw "Notification processing failed; pending deliveries are retained." }
