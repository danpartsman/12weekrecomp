name: Deliver coach notifications and process Snap deadlines
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/coach-notification-delivery.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: coach-notification-delivery
  cancel-in-progress: false
jobs:
  deliver:
    strategy:
      fail-fast: false
      matrix:
        site: [recomp-live, recomp-test]
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - name: Wake TEST so its server-side deadline worker runs
        if: matrix.site == 'recomp-test'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ready=$false
          for($attempt=1;$attempt -le 3;$attempt++) {
              try {
                  $response=Invoke-WebRequest -Uri 'https://test.12weekrecomp.com/health' -TimeoutSec 60
                  if($response.StatusCode -eq 200){$ready=$true;break}
              } catch { Write-Host "TEST warm-up attempt $attempt will retry: $($_.Exception.Message)" }
          }
          if(!$ready){throw 'TEST did not wake for deadline processing.'}
          Write-Host 'TEST is awake; its deadline worker reconciles due fines automatically.'
      - uses: azure/login@v2
        if: matrix.site == 'recomp-live'
        with:
          client-id: a81057ec-568b-4cec-9a95-1d4d3ff549a0
          tenant-id: e5e2dff4-ed49-4038-95d0-63d75304d52e
          subscription-id: 14564a14-42f9-4d2e-8a0b-a7c844dfb5c0
      - name: Wake app and process authorized maintenance without exporting its private job token
        if: matrix.site == 'recomp-live'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $site='${{ matrix.site }}'
          $pub = az webapp deployment list-publishing-credentials -g recomp_group -n $site | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$pub.scmUri) { throw "App maintenance endpoint unavailable." }
          $auth = az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv
          if ($LASTEXITCODE -ne 0 -or !$auth) { throw "App maintenance authorization unavailable." }
          Write-Output "::add-mask::$auth"
          $scm="https://$(([Uri]$pub.scmUri).Host)"
          $script = @'
          $ErrorActionPreference="Stop"
          $ProgressPreference="SilentlyContinue"
          $site='${{ matrix.site }}'
          if($env:WEBSITE_SITE_NAME -ne $site){throw "App identity mismatch."}
          Invoke-WebRequest -Uri "https://$site.azurewebsites.net/health" -UseBasicParsing -TimeoutSec 60 | Out-Null
          $keyPath=Join-Path $env:HOME "data\coach-notifications\job-key.txt"
          if (!(Test-Path $keyPath)) { Write-Output "Maintenance is not initialized yet; next scheduled run will retry."; exit 0 }
          $key=(Get-Content $keyPath -Raw).Trim()
          $result=Invoke-RestMethod -Uri "https://$site.azurewebsites.net/notifications/run" -Method Post -Headers @{"X-12WR-Notification-Job"=$key} -TimeoutSec 120
          Write-Output ("Maintenance processing complete=" + $result.processed)
          '@
          $encoded=[Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($script))
          $body=@{command="powershell.exe -NoProfile -EncodedCommand $encoded";dir="D:\home"}|ConvertTo-Json
          $result=Invoke-RestMethod -Uri "$scm/api/command" -Method Post -Headers @{Authorization="Bearer $auth"} -ContentType "application/json" -Body $body
          Write-Host $result.Output
          if ($result.ExitCode -ne 0) { throw "App maintenance failed; pending work is retained." }
