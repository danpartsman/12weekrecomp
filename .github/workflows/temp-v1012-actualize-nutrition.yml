name: TEMP v1012 actualize completed-workout nutrition

on:
  push:
    branches:
      - test
    paths:
      - '.github/workflows/temp-v1012-actualize-nutrition.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TEST
        uses: actions/checkout@v7
        with:
          ref: test
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Patch Engine 3.0 completed-workout nutrition actualization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('src/WebRecomp.Web/Services/Engine30/Engine30DashboardProjectionService.cs')
          text = path.read_text(encoding='utf-8-sig')

          daily_anchor = (
              "        var dailyResults =\n"
              "            new List<("
          )

          completed_body = '''// B2.35.33 COMPLETED-WORKOUT NUTRITION ACTUALIZATION
          //
          // Preserve the Weekly Plan as historical/planned truth for the workout UI,
          // but once a workout is completed, use the completed session's Engine 3.0
          // energy + glycogen physiology to recalculate that day's nutrition input.
          // This prevents a stale planned-workout carb target from surviving after
          // the user performs a materially different actual workout. Because the
          // weekly prescription and carryover are rebuilt from these inputs, the
          // correction also flows into same-week calorie/macronutrient allocation.
          var completedCutoff =
              knowledgeCutoffDate < weekStart
                  ? weekStart.AddDays(-1)
                  : knowledgeCutoffDate > weekEnd
                      ? weekEnd
                      : knowledgeCutoffDate;

          var completedSessions =
              completedCutoff < weekStart
                  ? new List<WorkoutSession>()
                  : await db.WorkoutSessions
                      .AsNoTracking()
                      .Where(x =>
                          x.ClientId == client.ClientId
                          && x.ProgramId == program.ProgramId
                          && x.WorkoutDate >= weekStart
                          && x.WorkoutDate <= completedCutoff
                          && x.CompletedFlag)
                      .OrderBy(x => x.WorkoutDate)
                      .ThenBy(x => x.CreatedAtUtc)
                      .ToListAsync(cancellationToken);

          completedSessions =
              (await DetailedWorkoutEngine30Adapter
                  .PreferBuilderSessionsAsync(
                      db,
                      completedSessions,
                      cancellationToken))
              .ToList();

          var completedByDate =
              completedSessions
                  .GroupBy(x => x.WorkoutDate)
                  .ToDictionary(
                      x => x.Key,
                      x => (IReadOnlyList<WorkoutSession>)x.ToArray());
          '''

          if 'B2.35.33 COMPLETED-WORKOUT NUTRITION ACTUALIZATION' not in text:
              pos = text.find(daily_anchor)
              if pos < 0:
                  raise SystemExit('daily runtime anchor not found; refusing unsafe patch')
              completed_block = textwrap.indent(completed_body, '        ') + '\n'
              text = text[:pos] + completed_block + text[pos:]

          prescription_start = "        var prescriptionInputs =\n"
          anchor_date = "        var anchorDate =\n"

          start = text.find(prescription_start)
          if start < 0:
              raise SystemExit('prescription input start not found; refusing unsafe patch')
          end = text.find(anchor_date, start)
          if end < 0:
              raise SystemExit('anchorDate boundary not found; refusing unsafe patch')

          replacement_body = '''var prescriptionInputs =
              new List<Engine30PrescriptionDayInput>(7);

          foreach (var item in dailyResults)
          {
              var plannedInput =
                  new Engine30PrescriptionDayInput(
                      Date: item.Runtime.ActionDate,
                      MaintenanceEnergyKcal:
                          item.Runtime.Energy.MaintenanceEnergyKcal,
                      WorkoutCategoryCode:
                          item.WorkoutCategoryCode,
                      GlycogenReloadRequirementG:
                          item.Runtime.Glycogen.CarbohydrateReloadRequirementG);

              Engine30PrescriptionDayInput? actualized = null;

              if (item.Runtime.ActionDate <= knowledgeCutoffDate
                  && completedByDate.TryGetValue(
                      item.Runtime.ActionDate,
                      out var actualDaySessions)
                  && actualDaySessions.Count > 0)
              {
                  actualized =
                      await BuildActualizedPrescriptionDayInputAsync(
                          client,
                          item.Runtime,
                          item.WorkoutCategoryCode,
                          actualDaySessions,
                          definitions,
                          measurements,
                          cancellationToken);
              }

              // If actual physiology cannot be resolved completely (for example,
              // an unmapped legacy workout), preserve the original planned target
              // rather than silently undercounting the day's workload.
              prescriptionInputs.Add(
                  actualized ?? plannedInput);
          }

          '''

          existing = text[start:end]
          if 'actualized ?? plannedInput' not in existing:
              replacement = textwrap.indent(replacement_body, '        ')
              text = text[:start] + replacement + text[end:]

          helper_anchor = (
              "    private async Task<(decimal DemandG, string? Summary)>\n"
              "        CalculateActualDayGlycogenAsync("
          )

          helper_body = '''private async Task<Engine30PrescriptionDayInput?>
          BuildActualizedPrescriptionDayInputAsync(
              Client client,
              Engine30DailyRuntimeResult plannedRuntime,
              string plannedWorkoutCategoryCode,
              IReadOnlyList<WorkoutSession> sessions,
              IReadOnlyDictionary<string, WorkoutTypeDefinition> definitions,
              IReadOnlyList<Measurement> measurements,
              CancellationToken cancellationToken)
          {
              if (sessions.Count == 0)
                  return null;

              var date =
                  plannedRuntime.ActionDate;

              var measurement =
                  ResolveMeasurement(
                      measurements,
                      date);

              var roles =
                  await activityProfiles.BuildRuntimeRolesAsync(
                      client.ClientId,
                      date,
                      cancellationToken);

              var actualNetWorkoutEnergyKcal =
                  0m;

              var actualGlycogenReloadRequirementG =
                  0m;

              var actualCategories =
                  new List<string>(sessions.Count);

              foreach (var stored in sessions)
              {
                  var workoutCode =
                      NormalizeWorkoutCode(
                          stored.WorkoutTypeCode);

                  Engine30WorkoutRuntimeProfileResolution profileResolution;

                  try
                  {
                      profileResolution =
                          await profileProvider.ResolveAsync(
                              workoutCode,
                              cancellationToken);
                  }
                  catch (KeyNotFoundException)
                  {
                      // Do not create false precision from a partially resolved day.
                      // Historical analysis may still describe the legacy session,
                      // but nutrition stays on the planned prescription until the
                      // actual workout can be mapped to Engine 3.0 physiology.
                      return null;
                  }

                  if (!definitions.TryGetValue(
                          workoutCode,
                          out var definition))
                  {
                      return null;
                  }

                  var session =
                      await DetailedWorkoutEngine30Adapter
                          .BuildActualInputAsync(
                              db,
                              workoutIntelligence,
                              stored,
                              profileResolution.Profile,
                              workoutCode,
                              cancellationToken);

                  var runtime =
                      await dailyRuntime.CalculateAsync(
                          new Engine30DailyRuntimeRequest(
                              ActionDate:
                                  date,
                              DateOfBirth:
                                  client.DateOfBirth!.Value,
                              SexCode:
                                  client.SexCode!,
                              HeightIn:
                                  client.HeightIn,
                              WeightLb:
                                  measurement.WeightLb!.Value,
                              BodyFatFraction:
                                  NormalizeBodyFatFraction(
                                      measurement.BodyFatPct),
                              OccupationalRoles:
                                  roles,
                              LifestyleActivityCode:
                                  client.LifestyleActivityCode ?? "MINIMAL",
                              WorkoutSession:
                                  session),
                          cancellationToken);

                  if (runtime.Workout is null)
                      return null;

                  actualNetWorkoutEnergyKcal +=
                      runtime.Energy.NetWorkoutActivityEnergyKcal;

                  actualGlycogenReloadRequirementG +=
                      runtime.Glycogen.CarbohydrateReloadRequirementG;

                  actualCategories.Add(
                      definition.WorkoutCategoryCode);
              }

              var actualCategory =
                  SelectActualPrescriptionCategory(
                      actualCategories,
                      plannedWorkoutCategoryCode);

              var actualMaintenanceEnergyKcal =
                  plannedRuntime.Energy.BaseLivingEnergyKcal
                  + plannedRuntime.Energy.HabitualActivityEnergyKcal
                  + actualNetWorkoutEnergyKcal;

              return new Engine30PrescriptionDayInput(
                  Date:
                      date,
                  MaintenanceEnergyKcal:
                      Math.Round(
                          actualMaintenanceEnergyKcal,
                          2,
                          MidpointRounding.AwayFromZero),
                  WorkoutCategoryCode:
                      actualCategory,
                  GlycogenReloadRequirementG:
                      Math.Round(
                          actualGlycogenReloadRequirementG,
                          2,
                          MidpointRounding.AwayFromZero));
          }

          private static string SelectActualPrescriptionCategory(
              IReadOnlyCollection<string> actualCategories,
              string fallbackCategory)
          {
              var selected =
                  actualCategories
                      .Select(x => new
                      {
                          Code = x,
                          Priority = PrescriptionCategoryPriority(x)
                      })
                      .Where(x => x.Priority > 0)
                      .OrderByDescending(x => x.Priority)
                      .Select(x => x.Code)
                      .FirstOrDefault();

              return selected ?? fallbackCategory;
          }

          private static int PrescriptionCategoryPriority(string? categoryCode)
              => categoryCode?.Trim().ToUpperInvariant() switch
              {
                  Engine30PrescriptionCategoryCodes.MajorStrength => 4,
                  Engine30PrescriptionCategoryCodes.AccessoryStrength => 3,
                  Engine30PrescriptionCategoryCodes.ConditioningCardio => 2,
                  Engine30PrescriptionCategoryCodes.RestRecoveryOther => 1,
                  _ => 0
              };

          '''

          if 'private async Task<Engine30PrescriptionDayInput?>' not in text:
              pos = text.find(helper_anchor)
              if pos < 0:
                  raise SystemExit('actual glycogen helper anchor not found; refusing unsafe patch')
              helper = textwrap.indent(helper_body, '    ')
              text = text[:pos] + helper + text[pos:]

          path.write_text(text, encoding='utf-8')

          test_body = '''using Xunit;

          namespace WebRecomp.Web.Tests;

          public sealed class Engine30CompletedWorkoutNutritionWiringTests
          {
              [Fact]
              public void DashboardProjection_ActualizesNutritionFromCompletedWorkoutPhysiology()
              {
                  var root = FindRepoRoot();
                  var source = File.ReadAllText(
                      Path.Combine(
                          root,
                          "src",
                          "WebRecomp.Web",
                          "Services",
                          "Engine30",
                          "Engine30DashboardProjectionService.cs"));

                  Assert.Contains("B2.35.33 COMPLETED-WORKOUT NUTRITION ACTUALIZATION", source, StringComparison.Ordinal);
                  Assert.Contains("completedByDate.TryGetValue", source, StringComparison.Ordinal);
                  Assert.Contains("BuildActualizedPrescriptionDayInputAsync", source, StringComparison.Ordinal);
                  Assert.Contains("actualized ?? plannedInput", source, StringComparison.Ordinal);
                  Assert.Contains("actualNetWorkoutEnergyKcal", source, StringComparison.Ordinal);
                  Assert.Contains("actualGlycogenReloadRequirementG", source, StringComparison.Ordinal);
                  Assert.Contains("plannedRuntime.Energy.BaseLivingEnergyKcal", source, StringComparison.Ordinal);
                  Assert.Contains("plannedRuntime.Energy.HabitualActivityEnergyKcal", source, StringComparison.Ordinal);
              }

              private static string FindRepoRoot()
              {
                  var current = new DirectoryInfo(AppContext.BaseDirectory);

                  while (current is not null)
                  {
                      var candidate = Path.Combine(
                          current.FullName,
                          "src",
                          "WebRecomp.Web",
                          "WebRecomp.Web.csproj");

                      if (File.Exists(candidate))
                          return current.FullName;

                      current = current.Parent;
                  }

                  throw new DirectoryNotFoundException(
                      "Could not locate the 12WR repository root.");
              }
          }
          '''

          test_path = Path('tests/WebRecomp.Web.Tests/Engine30CompletedWorkoutNutritionWiringTests.cs')
          test_path.write_text(test_body, encoding='utf-8')
          PY

      - name: Verify patch markers
        shell: bash
        run: |
          grep -n "B2.35.33 COMPLETED-WORKOUT NUTRITION ACTUALIZATION" src/WebRecomp.Web/Services/Engine30/Engine30DashboardProjectionService.cs
          grep -n "private async Task<Engine30PrescriptionDayInput?>" src/WebRecomp.Web/Services/Engine30/Engine30DashboardProjectionService.cs
          grep -n "actualized ?? plannedInput" src/WebRecomp.Web/Services/Engine30/Engine30DashboardProjectionService.cs

      - name: Restore web project
        run: dotnet restore src/WebRecomp.Web/WebRecomp.Web.csproj

      - name: Restore test project
        run: dotnet restore tests/WebRecomp.Web.Tests/WebRecomp.Web.Tests.csproj

      - name: Build web project
        run: dotnet build src/WebRecomp.Web/WebRecomp.Web.csproj --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test tests/WebRecomp.Web.Tests/WebRecomp.Web.Tests.csproj --configuration Release --no-restore

      - name: Commit tested patch to TEST
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/WebRecomp.Web/Services/Engine30/Engine30DashboardProjectionService.cs tests/WebRecomp.Web.Tests/Engine30CompletedWorkoutNutritionWiringTests.cs
          git diff --cached --check
          git commit -m "12WR TEST v1012 — actualize nutrition from completed workouts"
          git push origin HEAD:test
