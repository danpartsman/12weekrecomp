  <rect x="112" y="58" width="96" height="44" rx="10" fill="#0f172a"/>
  <text x="160" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">187.4</text>
  <circle cx="105" cy="132" r="16" fill="#dbeafe"/>
  <circle cx="160" cy="132" r="16" fill="#dcfce7"/>
  <circle cx="215" cy="132" r="16" fill="#ffedd5"/>
